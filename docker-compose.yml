services:
  postgres:
    image: postgres:latest
    container_name: pastry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pastry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pastry}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: